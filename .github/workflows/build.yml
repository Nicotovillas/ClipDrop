name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Native file clipboard roundtrip (no window)
        run: npx --no-install electron scripts/clipboard-smoke.cjs
      - if: runner.os == 'Windows'
        run: npm run build:windows
      - if: runner.os == 'macOS'
        run: npm run build:mac
      - if: runner.os == 'Windows'
        run: npm run verify:windows
      - name: Verify Windows product identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          foreach ($file in @('dist/win-unpacked/ClipDrop.exe', "dist/ClipDrop-Setup-x64-$version.exe")) {
            $info = (Get-Item $file).VersionInfo
            if ($info.ProductName -ne 'ClipDrop') { throw "Missing ClipDrop product metadata: $file" }
            if ($info.ProductVersion -ne $version) { throw "Unexpected product version: $file" }
            Write-Host "$file — Product: $($info.ProductName); Version: $($info.ProductVersion)"
            Write-Host "Authenticode: $((Get-AuthenticodeSignature $file).Status)"
          }
      - name: Defender scan when available
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/scan-windows.ps1
      - run: npm run checksums
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ClipDrop-${{ runner.os }}
          path: |
            dist/ClipDrop-Setup-*.exe
            dist/ClipDrop-Mac-*.zip
            dist/SHA256SUMS-*.txt
            dist/defender-report.json
          if-no-files-found: error
          retention-days: 14
