[package]
name = "clipdrop"
version = "0.3.0"
description = "Descargador personal con yt-dlp"
authors = ["Nicolás Tovillas"]
edition = "2021"
publish = false
default-run = "clipdrop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
clipdrop-core = { path = "../crates/clipdrop-core" }
clipdrop-clipboard = { path = "../crates/clipdrop-clipboard" }

[dev-dependencies]
tempfile = "3"
